# Hyprland Fan Control Keybind Configuration
# Add this to your ~/.config/hypr/hyprland.conf file

# Fan Control GUI - Ctrl+Alt+F
bind = CTRL ALT, F, exec, /usr/local/bin/rofi_fan_control.sh

# Additional optional keybinds:
# Quick presets (Silent mode 30%)
bind = CTRL ALT, 1, exec, /usr/local/bin/fan_control.sh set 1 30; /usr/local/bin/fan_control.sh set 3 30; /usr/local/bin/fan_control.sh set 6 30
# Quick presets (Quiet mode 50%)
bind = CTRL ALT, 2, exec, /usr/local/bin/fan_control.sh set 1 50; /usr/local/bin/fan_control.sh set 3 50; /usr/local/bin/fan_control.sh set 6 50
# Quick presets (Performance mode 80%)
bind = CTRL ALT, 3, exec, /usr/local/bin/fan_control.sh set 1 80; /usr/local/bin/fan_control.sh set 3 80; /usr/local/bin/fan_control.sh set 6 80
# Auto mode (Return to BIOS control)
bind = CTRL ALT, 0, exec, /usr/local/bin/fan_control.sh auto 1; /usr/local/bin/fan_control.sh auto 3; /usr/local/bin/fan_control.sh auto 6

# Temperature monitoring
bind = CTRL ALT, T, exec, rofi -e "$(sensors | grep -E '(Tctl|SYSTIN|fan[36]):')" -theme-str 'window {width: 400px;}'
